[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "business-match"
version = "0.1.0"
description = "Adaptive B2B recommendations and search"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.6,<3", "pydantic-ai-slim[openai]>=1,<2",
  "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4",
  "httpx>=0.27,<1", "numpy>=1.26,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/business_match"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
